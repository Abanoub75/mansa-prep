<style>
  .qr-scanner-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 20px 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    margin-bottom: 20px;
  }

  /* منطقة عرض الكاميرا الحية */
  .camera-viewport-wrapper {
    position: relative;
    width: 100%;
    min-height: 290px;
    background: #0f172a;
    border-radius: 18px;
    overflow: hidden;
    margin-top: 16px;
    display: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    border: 2px solid #312e81;
  }

  #qrVideoReader {
    width: 100% !important;
    border-radius: 16px;
  }

  #qrVideoReader video {
    width: 100% !important;
    height: auto !important;
    border-radius: 16px;
    object-fit: cover !important;
  }

  /* خط المسح المتحرك داخل الكاميرا */
  .scanner-laser-line {
    position: absolute;
    top: 15%;
    left: 10%;
    right: 10%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #22c55e, #a855f7, transparent);
    box-shadow: 0 0 12px #22c55e;
    animation: scanLaser 2.2s infinite ease-in-out;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes scanLaser {
    0% { top: 15%; opacity: 0.2; }
    50% { top: 80%; opacity: 1; }
    100% { top: 15%; opacity: 0.2; }
  }

  /* شريط التنبيهات */
  .scan-alert-box {
    display: none;
    padding: 14px 16px;
    border-radius: 14px;
    margin-top: 14px;
    text-align: center;
    font-weight: 900;
    font-size: 15px;
  }

  .alert-success { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
  .alert-error { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }
  .alert-info { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #bfdbfe; }

  /* سجل آخر المسجلات في الجلسة */
  .recent-scans-box {
    margin-top: 20px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 14px;
  }

  .recent-scans-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 900;
    font-size: 14px;
    color: #1e1b4b;
  }

  .scanned-pill {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13.5px;
    font-weight: 800;
  }
</style>

<div class="qr-scanner-card animate-fade">
  <h2 class="page-title">📹 قراءة كود QR المباشرة بالكاميرا</h2>

  <div class="form-group">
    <label for="qrAttendanceSheetSelect">📂 اختر كشف الحضور (الصف):</label>
    <select id="qrAttendanceSheetSelect" onchange="playClickSound()">
      <option value="">-- جاري تحميل الكشوفات --</option>
    </select>
  </div>

  <div class="form-group">
    <label for="qrMeetingDateSelect">📅 اختر تاريخ الاجتماع:</label>
    <select id="qrMeetingDateSelect" disabled onchange="playClickSound()">
      <option value="">-- اختر الكشف أولاً --</option>
    </select>
  </div>

  <!-- زر تشغيل وإيقاف الكاميرا -->
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <button id="btnToggleCamera" class="btn-action btn-primary" type="button" disabled onclick="toggleCameraScanner()">
      📷 تشغيل الكاميرا للقراءة الفورية
    </button>
  </div>

  <!-- شاشة الكاميرا المباشرة -->
  <div id="cameraViewportWrapper" class="camera-viewport-wrapper">
    <div class="scanner-laser-line" id="scannerLaser"></div>
    <div id="qrVideoReader"></div>
  </div>

  <!-- تنبيه حالة القراءة والتسجيل -->
  <div id="scanStatusAlert" class="scan-alert-box"></div>

  <!-- خيار بديل: رفع صورة من الاستوديو إذا لزم الأمر -->
  <div style="margin-top: 18px; text-align: center; border-top: 1px dashed #e2e8f0; padding-top: 14px;">
    <button type="button" style="background: none; border: none; color: #64748b; font-size: 13px; font-weight: 800; text-decoration: underline; cursor: pointer;" onclick="document.getElementById('qrFileFallback').click()">
      🖼️ أو اختر صورة كود QR من ألبوم الهاتف
    </button>
    <input type="file" id="qrFileFallback" accept="image/*" style="display: none;" onchange="handleFileFallback(event)">
  </div>

  <!-- سجل المسجلين في هذه اللحظة -->
  <div id="recentScansSection" class="recent-scans-box" style="display: none;">
    <div class="recent-scans-header">
      <span>📋 آخر المخدومين الذين تم تسجيلهم الآن:</span>
      <span id="scanCountBadge" style="background: #16a34a; color: white; border-radius: 20px; padding: 2px 10px; font-size: 12px;">0</span>
    </div>
    <div id="scannedListItems"></div>
  </div>
</div>

<div id="qr-hidden-file-reader" style="display:none;"></div>

<script>
let selectedSheetName = '';
let selectedColIndex = '';
let html5QrScanner = null;
let isCameraActive = false;
let isProcessingAttendance = false;
let lastScannedCode = '';
let lastScanTimestamp = 0;
let totalScannedInSession = 0;

const sheetSelect = document.getElementById('qrAttendanceSheetSelect');
const dateSelect = document.getElementById('qrMeetingDateSelect');
const btnToggle = document.getElementById('btnToggleCamera');
const viewportWrapper = document.getElementById('cameraViewportWrapper');
const alertBox = document.getElementById('scanStatusAlert');

// صوت Beep مميز عند نجاح القراءة الفورية
function playScanBeep() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch (e) {}
}

function showStatus(message, type) {
  alertBox.innerHTML = message;
  alertBox.className = 'scan-alert-box alert-' + type;
  alertBox.style.display = 'block';
}

// 1. تحميل كشوفات الصفوف
async function loadAttendanceSheetsList() {
  sheetSelect.disabled = true;
  try {
    const res = await apiGet('getAttendanceSheets');
    sheetSelect.innerHTML = '<option value="">-- اختر كشف الصف --</option>';
    if (res.sheets && res.sheets.length > 0) {
      res.sheets.forEach(function(name) {
        sheetSelect.appendChild(new Option(name, name));
      });
      sheetSelect.disabled = false;
    } else {
      sheetSelect.innerHTML = '<option value="">لا توجد كشوفات</option>';
    }
  } catch (err) {
    sheetSelect.disabled = false;
    showStatus('تعذر تحميل الكشوفات: ' + err.message, 'error');
  }
}

// 2. عند تغيير كشف الصف
sheetSelect.addEventListener('change', async function() {
  selectedSheetName = sheetSelect.value;
  selectedColIndex = '';
  dateSelect.disabled = true;
  btnToggle.disabled = true;
  dateSelect.innerHTML = '<option value="">-- جاري تحميل التواريخ --</option>';
  
  if (isCameraActive) {
    await stopCameraScanner();
  }

  if (!selectedSheetName) {
    dateSelect.innerHTML = '<option value="">-- اختر الكشف أولاً --</option>';
    return;
  }

  try {
    const res = await apiGet('getAttendanceData', { sheetName: selectedSheetName });
    dateSelect.innerHTML = '<option value="">-- اختر تاريخ الاجتماع --</option>';
    if (res.dates && res.dates.length > 0) {
      res.dates.forEach(function(item) {
        dateSelect.appendChild(new Option(item.dateText, item.colIndex));
      });
      dateSelect.disabled = false;
    } else {
      dateSelect.innerHTML = '<option value="">لا توجد تواريخ مسجلة</option>';
    }
  } catch (err) {
    showStatus('فشل تحميل التواريخ: ' + err.message, 'error');
  }
});

// 3. عند اختيار التاريخ
dateSelect.addEventListener('change', function() {
  selectedColIndex = dateSelect.value;
  const ready = !!(selectedSheetName && selectedColIndex);
  btnToggle.disabled = !ready;
  if (!ready && isCameraActive) {
    stopCameraScanner();
  }
});

// 4. تشغيل / إيقاف الكاميرا الحية
async function toggleCameraScanner() {
  if (isCameraActive) {
    await stopCameraScanner();
  } else {
    await startCameraScanner();
  }
}

async function startCameraScanner() {
  if (!selectedSheetName || !selectedColIndex) {
    showStatus('⚠️ يرجى اختيار كشف الحضور وتاريخ الاجتماع أولاً', 'error');
    return;
  }

  if (typeof Html5Qrcode === 'undefined') {
    showStatus('❌ مكتبة الكاميرا لم تكتمل بعد، تأكد من الإنترنت.', 'error');
    return;
  }

  viewportWrapper.style.display = 'block';
  showStatus('⏳ جارٍ فتح الكاميرا المباشرة...', 'info');
  btnToggle.disabled = true;

  try {
    if (!html5QrScanner) {
      html5QrScanner = new Html5Qrcode("qrVideoReader");
    }

    const config = {
      fps: 12,
      qrbox: function(viewWidth, viewHeight) {
        const edge = Math.floor(Math.min(viewWidth, viewHeight) * 0.75);
        return { width: edge, height: edge };
      },
      aspectRatio: 1.0
    };

    await html5QrScanner.start(
      { facingMode: "environment" },
      config,
      onScanSuccessCallback,
      onScanErrorCallback
    );

    isCameraActive = true;
    btnToggle.innerHTML = '⏹️ إيقاف الكاميرا';
    btnToggle.className = 'btn-action btn-secondary';
    btnToggle.disabled = false;
    showStatus('🟢 الكاميرا تعمل الآن! وجّه الكود نحو المربع للمسح المباشر', 'info');

  } catch (err) {
    console.error("Camera init error:", err);
    viewportWrapper.style.display = 'none';
    btnToggle.disabled = false;
    btnToggle.innerHTML = '📷 تشغيل الكاميرا للقراءة الفورية';
    btnToggle.className = 'btn-action btn-primary';
    showStatus('⚠️ تعذر تشغيل الكاميرا: تأكد من إعطاء إذن الكاميرا للمتصفح.', 'error');
  }
}

async function stopCameraScanner() {
  if (html5QrScanner && isCameraActive) {
    try {
      await html5QrScanner.stop();
    } catch(e) {}
  }
  isCameraActive = false;
  viewportWrapper.style.display = 'none';
  btnToggle.innerHTML = '📷 تشغيل الكاميرا للقراءة الفورية';
  btnToggle.className = 'btn-action btn-primary';
}

function onScanErrorCallback(err) {}

// عند التقاط كود QR بنجاح في الكاميرا الحية
async function onScanSuccessCallback(decodedText) {
  const code = String(decodedText || '').trim();
  if (!code) return;

  const now = Date.now();
  // منع قراءة نفس الكود مرتين متتاليتين خلال 3 ثوانٍ
  if (code === lastScannedCode && (now - lastScanTimestamp) < 3000) {
    return;
  }

  if (isProcessingAttendance) return;
  isProcessingAttendance = true;
  lastScannedCode = code;
  lastScanTimestamp = now;

  // صوت النغمة الفورية
  playScanBeep();

  showStatus('⏳ تمت قراءة الكود (' + code + ')! جارٍ التسجيل في الشيت...', 'info');

  try {
    const response = await apiPost('registerAttendanceByQRWithDate', {
      sheetName: selectedSheetName,
      colIndex: Number(selectedColIndex),
      studentId: code
    });

    if (response && response.success) {
      showStatus('✅ ' + (response.message || 'تم تسجيل الحضور بنجاح'), 'success');
      recordScanInHistory(code, response.message || 'تم التسجيل', true);
    } else {
      showStatus('⚠️ ' + (response && response.message ? response.message : 'تعذر تسجيل الحضور'), 'error');
      recordScanInHistory(code, response && response.message ? response.message : 'خطأ', false);
    }
  } catch (err) {
    showStatus('❌ حدث خطأ في الاتصال: ' + err.message, 'error');
  } finally {
    isProcessingAttendance = false;
  }
}

// إضافة الطالب لسجل المسجلين المباشر
function recordScanInHistory(code, message, isSuccess) {
  totalScannedInSession++;
  document.getElementById('recentScansSection').style.display = 'block';
  document.getElementById('scanCountBadge').textContent = totalScannedInSession;

  const listContainer = document.getElementById('scannedListItems');
  const pill = document.createElement('div');
  pill.className = 'scanned-pill';
  pill.style.borderLeft = isSuccess ? '4px solid #16a34a' : '4px solid #dc2626';

  const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  pill.innerHTML = `
    <div>
      <span style="color: ${isSuccess ? '#15803d' : '#b91c1c'}; font-size: 15px;">${isSuccess ? '✅' : '❌'}</span>
      <span style="color: #1e1b4b; margin-right: 6px;">${message}</span>
      <span style="color: #64748b; font-size: 11px;">(كود: ${code})</span>
    </div>
    <span style="font-size: 11px; color: #94a3b8; font-family: monospace;">${timeStr}</span>
  `;

  listContainer.insertBefore(pill, listContainer.firstChild);
}

// خيار بديل في حال أراد اختيار صورة من المعرض
async function handleFileFallback(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (!selectedSheetName || !selectedColIndex) {
    showStatus('⚠️ اختر كشف الصف وتاريخ الاجتماع أولاً', 'error');
    event.target.value = '';
    return;
  }

  showStatus('⏳ جارٍ تحليل الصورة من الألبوم...', 'info');
  try {
    const fileReader = new Html5Qrcode("qr-hidden-file-reader");
    const decoded = await fileReader.scanFile(file, false);
    await onScanSuccessCallback(decoded);
  } catch (err) {
    showStatus('❌ تعذر العثور على كود QR واضح في الصورة المختارة', 'error');
  } finally {
    event.target.value = '';
  }
}

// تنظيف الكاميرا عند الخروج من الصفحة
window.stopActiveScanner = stopCameraScanner;
window.addEventListener('beforeunload', stopCameraScanner);

// بدء التحميل
loadAttendanceSheetsList();
</script>
