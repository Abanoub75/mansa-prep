<div class="page-card animate-fade">
  <h2 class="page-title">🔍 بحث وتعديل قاعدة البيانات</h2>

  <!-- قسم البحث -->
  <div id="searchMainSection">
    <div class="form-group">
      <label>📂 المجموعة أو نطاق البحث:</label>
      <select id="searchSheetSelect" onclick="playClickSound()">
        <option value="">-- جاري تحميل المجموعات --</option>
        <option value="ALL">🌟 بحث في كل المجموعات معاً</option>
      </select>
    </div>

    <div class="form-group">
      <label>👤 اسم المخدوم:</label>
      <input type="text" id="searchNameInput" placeholder="اكتب اسم المخدوم هنا للبحث الفوري..." autocomplete="off">
    </div>

    <button type="button" class="btn-action btn-primary" onclick="executeSearch()">
      🔍 بحث عن المخدوم
    </button>

    <div style="margin-top: 22px; padding-top: 16px; border-top: 1px dashed #cbd5e1; text-align: center;">
      <p style="margin: 0 0 10px 0; font-size: 14px; color: #64748b; font-weight: 800;">
        لم تجد الاسم وتريد إضافته لقاعدة البيانات؟
      </p>
      <button type="button" class="btn-action btn-outline" onclick="prepareAddNewUser()">
        ➕ إضافة مخدوم جديد
      </button>
    </div>
  </div>

  <!-- نموذج التعديل والإضافة -->
  <div id="userFormSection" style="display: none;">
    <div id="targetSheetBadge" style="background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:12px; border-radius:14px; font-weight:900; text-align:center; margin-bottom:16px;">
      المجموعة:
    </div>

    <form id="userDataForm" onsubmit="handleUserFormSubmit(event)">
      <div class="form-group">
        <label>الاسم الكامل:</label>
        <input type="text" id="fullName" required placeholder="اسم المخدوم ثلاثي">
      </div>
      <div class="form-group">
        <label>العنوان:</label>
        <input type="text" id="address" placeholder="المنطقة والشارع بالتفصيل">
      </div>
      <div class="form-group">
        <label>رقم الموبايل:</label>
        <input type="tel" id="phone" placeholder="010xxxxxxxx">
      </div>
      <div class="form-group">
        <label>الكنيسة:</label>
        <input type="text" id="church" placeholder="اسم الكنيسة">
      </div>
      <div class="form-group">
        <label>تاريخ الميلاد:</label>
        <input type="text" id="birthDate" placeholder="YYYY/MM/DD">
      </div>
      <div class="form-group">
        <label>المدرسة / الفصل:</label>
        <input type="text" id="school" placeholder="المدرسة والصف الدراسي">
      </div>
      <div class="form-group">
        <label>شماس:</label>
        <select id="deacon">
          <option value="">اختر...</option>
          <option value="نعم">نعم</option>
          <option value="لا">لا</option>
        </select>
      </div>
      <div class="form-group">
        <label>أب الاعتراف:</label>
        <input type="text" id="confessor" placeholder="أبونا المعترف">
      </div>
      <div class="form-group">
        <label>ملاحظات خاصة:</label>
        <textarea id="notes" rows="2" placeholder="أي ملاحظات تفصيلية..."></textarea>
      </div>

      <div class="btn-grid">
        <button type="submit" id="saveStudentButton" class="btn-action btn-success">
          💾 حفظ البيانات
        </button>
        <button type="button" class="btn-action btn-secondary" onclick="backToSearchMainView()">
          ⬅ إلغاء ورجوع
        </button>
      </div>
    </form>
  </div>

  <div id="searchStatusMsg" style="text-align: center; margin-top: 15px; font-weight: 900; font-size: 15px;"></div>
</div>

<script>
window.currentEditingSheet = "";
window.isNewUserMode = false;
window.originalEditingName = "";

async function loadSearchSheetsList() {
  try {
    const res = await apiGet('getDataSheets');
    const select = document.getElementById('searchSheetSelect');
    if (!select) return;
    select.innerHTML = '<option value="">-- اختر المجموعة أو النطاق --</option><option value="ALL">🌟 بحث في كل المجموعات معاً</option>';
    if (res.sheets && res.sheets.length > 0) {
      res.sheets.forEach(function(sheetName) {
        select.appendChild(new Option(sheetName, sheetName));
      });
    }
  } catch (err) {
    showSearchStatus("❌ تعذر تحميل المجموعات: " + err.message, "red");
  }
}

async function executeSearch() {
  playClickSound();
  const sheetName = document.getElementById('searchSheetSelect').value;
  const nameQuery = document.getElementById('searchNameInput').value.trim();

  if (!sheetName) return alert("يرجى اختيار المجموعة أولاً!");
  if (!nameQuery) return alert("يرجى كتابة اسم المخدوم للبحث عنه!");

  showGlobalLoader();

  try {
    const res = await apiGet('searchInSheet', { sheetName: sheetName, nameQuery: nameQuery });
    showSearchStatus("", "");

    if (res && res.error) {
      showSearchStatus(res.error, "red");
    } else if (res && res.found) {
      document.getElementById('targetSheetBadge').innerText = "المجموعة: " + res.sheetName;
      document.getElementById('fullName').value = res.data.name || "";
      document.getElementById('address').value = res.data.address || "";
      document.getElementById('phone').value = res.data.phone || "";
      document.getElementById('church').value = res.data.church || "";
      document.getElementById('birthDate').value = res.data.birthDate || "";
      document.getElementById('school').value = res.data.school || "";
      document.getElementById('deacon').value = res.data.deacon || "";
      document.getElementById('confessor').value = res.data.confessor || "";
      document.getElementById('notes').value = res.data.notes || "";

      window.currentEditingSheet = res.sheetName;
      window.isNewUserMode = false;
      window.originalEditingName = String(res.data.name || "");

      document.getElementById('searchMainSection').style.display = 'none';
      document.getElementById('userFormSection').style.display = 'block';
    } else {
      showSearchStatus("لم يتم العثور على المخدوم! يمكنك إضافته من الزر بالأسفل.", "#d97706");
    }
  } catch (err) {
    showSearchStatus("❌ فشل البحث: " + err.message, "red");
  }
}

function prepareAddNewUser() {
  playClickSound();
  const sheetName = document.getElementById('searchSheetSelect').value;
  const nameQuery = document.getElementById('searchNameInput').value.trim();

  if (!sheetName || sheetName === "ALL") {
    return alert("يرجى تحديد صف معين (أولى أو ثانية أو ثالثة) لإضافة المخدوم إليه!");
  }
  if (!nameQuery) {
    return alert("يرجى كتابة الاسم في مربع البحث أولاً لترحيله للإضافة!");
  }

  window.currentEditingSheet = sheetName;
  window.isNewUserMode = true;
  window.originalEditingName = "";

  document.getElementById('targetSheetBadge').innerText = "إضافة جديد في مجموعة: " + sheetName;
  document.getElementById('fullName').value = nameQuery;

  ['address', 'phone', 'church', 'birthDate', 'school', 'deacon', 'confessor', 'notes'].forEach(function(id) {
    document.getElementById(id).value = '';
  });

  document.getElementById('searchMainSection').style.display = 'none';
  document.getElementById('userFormSection').style.display = 'block';
  showSearchStatus("", "");
}

function backToSearchMainView() {
  playClickSound();
  document.getElementById('userFormSection').style.display = 'none';
  document.getElementById('searchMainSection').style.display = 'block';
  document.getElementById('userDataForm').reset();
  window.originalEditingName = "";
  window.currentEditingSheet = "";
  window.isNewUserMode = false;
  showSearchStatus("", "");
}

async function handleUserFormSubmit(e) {
  e.preventDefault();
  playClickSound();

  const saveButton = document.getElementById('saveStudentButton');
  if (saveButton.disabled) return;
  saveButton.disabled = true;

  const formData = {
    name: document.getElementById('fullName').value.trim(),
    address: document.getElementById('address').value,
    phone: document.getElementById('phone').value,
    church: document.getElementById('church').value,
    birthDate: document.getElementById('birthDate').value,
    school: document.getElementById('school').value,
    deacon: document.getElementById('deacon').value,
    confessor: document.getElementById('confessor').value,
    notes: document.getElementById('notes').value
  };

  if (!formData.name) {
    saveButton.disabled = false;
    return showSearchStatus("❌ يرجى إدخال اسم المخدوم.", "red");
  }

  showGlobalLoader();

  try {
    const res = await apiPost('saveDataToSheet', {
      sheetName: window.currentEditingSheet,
      formData: formData,
      isNewUserMode: window.isNewUserMode,
      originalStudentName: window.originalEditingName
    });

    saveButton.disabled = false;
    const msg = res.message || (res.success ? "✅ تم الحفظ بنجاح!" : "❌ فشل الحفظ");
    const isError = !res.success || msg.indexOf("❌") === 0 || msg.indexOf("⚠️") === 0;

    showSearchStatus(msg, isError ? "#dc2626" : "#16a34a");

    if (res.success && msg.indexOf("✅") === 0) {
      setTimeout(function() {
        backToSearchMainView();
      }, 1500);
    }
  } catch (err) {
    saveButton.disabled = false;
    showSearchStatus("❌ فشل الحفظ: " + err.message, "#dc2626");
  }
}

function showGlobalLoader() {
  const statusEl = document.getElementById('searchStatusMsg');
  if (statusEl) {
    statusEl.innerHTML = '<div class="global-loader"><span></span><span></span><span></span></div>';
  }
}

function showSearchStatus(msg, color) {
  const statusEl = document.getElementById('searchStatusMsg');
  if (statusEl) {
    statusEl.innerText = msg;
    statusEl.style.color = color || "";
  }
}

loadSearchSheetsList();
</script>
